    <script>
        /* WEB AUDIO API FOR SOUND EFFECTS */
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
        }

        function playSound(type) {
            initAudio();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;
            if (type === 'correct') {
                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(659.25, now);
                osc1.frequency.setValueAtTime(880, now + 0.15);
                gain1.gain.setValueAtTime(0.3, now);
                gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.start(now);
                osc1.stop(now + 0.6);
            } else if (type === 'pop') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(200, now + 0.08);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'clear') {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.12);
                    gain.gain.setValueAtTime(0.25, now + idx * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.12 + 0.4);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.12);
                    osc.stop(now + idx * 0.12 + 0.4);
                });
            }
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ja-JP';
                utterance.rate = 0.85; // Slower for clarity
                window.speechSynthesis.speak(utterance);
            }
        }

        let sceneQuestionIndex = 0;
        let currentSceneQuestion = null;
        let isSceneHintShown = false;

        function startSceneGame() {
            sceneQuestionIndex = 0;
            showView('view-scene');
            loadNextSceneQuestion();
        }

        function loadNextSceneQuestion() {
            if (sceneQuestionIndex >= 5) {
                playSound('clear');
                speakText('すごーい！ばめんの ことば ぜんぶ クリアできたね！');
                addStar();
                alert('🎉 すごーい！ 5もん ぜんぶ クリアできたね！');
                showMenu();
                return;
            }

            isSceneHintShown = false;
            document.getElementById('scene-q-num').textContent = sceneQuestionIndex + 1;
            
            const shuffled = [...SCENE_DATA].sort(() => Math.random() - 0.5);
            currentSceneQuestion = shuffled[sceneQuestionIndex];

            document.getElementById('scene-emoji').textContent = currentSceneQuestion.emoji;
            document.getElementById('scene-situation').textContent = currentSceneQuestion.situation;
            document.getElementById('scene-question').textContent = currentSceneQuestion.question;

            speakText(`${currentSceneQuestion.situation}。${currentSceneQuestion.question}`);

            const choices = [...currentSceneQuestion.choices].sort(() => Math.random() - 0.5);
            const container = document.getElementById('scene-choices');
            container.innerHTML = '';

            choices.forEach(item => {
                const btn = document.createElement('button');
                btn.className = "bg-white hover:bg-purple-50 border-4 border-purple-200 hover:border-purple-500 p-6 md:p-8 rounded-3xl flex flex-col items-center justify-center shadow-lg transition bounce-hover min-h-[140px]";
                btn.innerHTML = `
                    <span class="scene-hint-emoji text-6xl md:text-7xl mb-2 hidden">${item.icon}</span>
                    <span class="text-3xl md:text-4xl font-black text-slate-800">${item.word}</span>
                `;
                btn.onclick = () => checkSceneAnswer(item.word);
                container.appendChild(btn);
            });

        function showSceneHint() {
            playSound('pop');
            if (isSceneHintShown) return;
            isSceneHintShown = true;
            
            speakText('ヒントだよ！えを さんこうに してみてね！');
            
            const hintEmojis = document.querySelectorAll('.scene-hint-emoji');
            hintEmojis.forEach(el => {
                el.classList.remove('hidden');
                el.classList.add('hana-maru');
            });
        }

        function checkSceneAnswer(selectedWord) {
            if (selectedWord === currentSceneQuestion.correct) {
                playSound('correct');
                speakText(`せいかい！${selectedWord} だね！`);
                sceneQuestionIndex++;
                setTimeout(loadNextSceneQuestion, 1400);
            } else {
                playSound('pop');
                speakText('もういちど ばめんを みて えらんでみよう！');
            }
        }

        /* VIEW NAVIGATION */
        function showView(viewId) {
            playSound('pop');
            document.querySelectorAll('main > section').forEach(sec => sec.classList.add('hidden'));
            document.getElementById(viewId).classList.remove('hidden');
        }

        function showMenu() {
            showView('view-menu');
        }

        function addStar() {
            stars++;
            document.getElementById('star-count').textContent = stars;
        }

        /* MODE 1: KANJI MATCHING GAME LOGIC */
        function startMatchingGame() {
            matchQuestionIndex = 0;
            showView('view-matching');
            loadNextMatchingQuestion();
        }

        function loadNextMatchingQuestion() {
            if (matchQuestionIndex >= 5) {
                playSound('clear');
                speakText('すごーい！ぜんぶ クリアできたね！');
                addStar();
                alert('🎉 すごーい！ 5もん ぜんぶ クリアできたね！');
                showMenu();
                return;
            }

            document.getElementById('match-q-num').textContent = matchQuestionIndex + 1;
            
            // Randomly select target from all 80 kanji
            const randomIndex = Math.floor(Math.random() * KANJI_DATA.length);
            currentMatchQuestion = KANJI_DATA[randomIndex];
            
            // Display Kanji ONLY (Reading label removed as requested)
            document.getElementById('match-target-kanji').textContent = currentMatchQuestion.kanji;

            speakText(`${currentMatchQuestion.kanji}。この かんじの えは どれかな？`);

            // Generate options (Correct choice + 1 distractor)
            let choices = [currentMatchQuestion];
            let otherChoices = KANJI_DATA.filter(k => k.kanji !== currentMatchQuestion.kanji);
            otherChoices.sort(() => Math.random() - 0.5);
            choices.push(otherChoices[0]);
            choices.sort(() => Math.random() - 0.5);

            const container = document.getElementById('match-choices');
            container.innerHTML = '';

            // Giant touch-friendly buttons
            choices.forEach(item => {
                const btn = document.createElement('button');
                btn.className = "bg-white hover:bg-sky-50 border-4 border-slate-300 hover:border-sky-500 p-8 rounded-3xl flex flex-col items-center justify-center gap-4 shadow-lg transition bounce-hover min-h-[220px]";

                    <span class="text-8xl md:text-9xl">${item.emoji}</span>
                    <span class="text-xl md:text-2xl font-black text-slate-700">${item.meaning.split('（')[0]}</span>
                `;
                btn.onclick = () => checkMatchAnswer(item);
                container.appendChild(btn);
            });
        }

            if (selected.kanji === currentMatchQuestion.kanji) {
                playSound('correct');
                speakText('せいかい！すごいね！');
                matchQuestionIndex++;
                setTimeout(loadNextMatchingQuestion, 1200);
            } else {
                playSound('pop');
                speakText('ざんねん！もういちど えらんでみよう！');
            }

        /* MODE 2: KANJI WRITING & TRACING LOGIC */
        let canvas, ctx, isDrawing = false;

        function startWritingGame() {
            showView('view-writing');
            initWritingCanvas();
            loadWritingKanji(0);
        }

        function loadWritingKanji(index) {
            currentWritingIndex = (index + KANJI_DATA.length) % KANJI_DATA.length;
            const data = KANJI_DATA[currentWritingIndex];
            
            document.getElementById('current-kanji-num').textContent = currentWritingIndex + 1;
            document.getElementById('writing-guide-kanji').textContent = data.kanji;
            document.getElementById('writing-info').textContent = `「${data.kanji}」（${data.reading}）`;
            document.getElementById('btn-read-kanji').onclick = () => speakText(`${data.kanji}。よみかたは、${data.reading}`);
            document.getElementById('hanamaru-overlay').classList.add('hidden');
            clearCanvas();
            speakText(`${data.kanji} を なぞって かいてみよう！`);
        }

        function prevWritingKanji() {
            playSound('pop');
            loadWritingKanji(currentWritingIndex - 1);
        }

        function nextWritingKanji() {
            playSound('pop');
            loadWritingKanji(currentWritingIndex + 1);
        }

        function openKanjiPickerModal() {
            playSound('pop');
            const grid = document.getElementById('kanji-grid-modal');
            grid.innerHTML = '';

            KANJI_DATA.forEach((item, idx) => {
                const btn = document.createElement('button');
                btn.className = `p-3 text-2xl font-black rounded-2xl border-2 transition bounce-hover flex flex-col items-center justify-center ${idx === currentWritingIndex ? 'bg-emerald-500 text-white border-emerald-600' : 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-emerald-100'}`;
                btn.innerHTML = `
                    <span>${item.kanji}</span>
                    <span class="text-xs font-normal text-slate-400">${item.reading}</span>
                `;
                btn.onclick = () => {
                    loadWritingKanji(idx);
                    closeKanjiPickerModal();
                };
                grid.appendChild(btn);
            });

            document.getElementById('modal-kanji-picker').classList.remove('hidden');
        }

        function closeKanjiPickerModal() {
            playSound('pop');
            document.getElementById('modal-kanji-picker').classList.add('hidden');
        }

        function initWritingCanvas() {
            canvas = document.getElementById('write-canvas');
            ctx = canvas.getContext('2d');

            ctx.lineWidth = 22; // Extra thick pen stroke
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#059669';

            canvas.onmousedown = (e) => startDraw(getPos(e));
            canvas.onmousemove = (e) => draw(getPos(e));
            canvas.onmouseup = endDraw;

            canvas.ontouchstart = (e) => {
                e.preventDefault();
                startDraw(getPos(e.touches[0]));
            };
            canvas.ontouchmove = (e) => {
                e.preventDefault();
                draw(getPos(e.touches[0]));
            };
            canvas.ontouchend = endDraw;
        }

        function getPos(evt) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (evt.clientX - rect.left) * (canvas.width / rect.width),
                y: (evt.clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        function startDraw(pos) {
            isDrawing = true;
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        }

        function draw(pos) {
            if (!isDrawing) return;
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
        }

        function endDraw() {
            isDrawing = false;
        }

        function clearCanvas() {
            if (ctx) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
            document.getElementById('hanamaru-overlay').classList.add('hidden');
        }

        /* Save Trace Artwork as PNG Image */
        function saveCanvasImage() {
            playSound('pop');
            const data = KANJI_DATA[currentWritingIndex];
            
            // Offscreen canvas for synthesis (Guide Kanji + User Handwriting)
            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = 400;
            exportCanvas.height = 400;
            const expCtx = exportCanvas.getContext('2d');

            // Fill white background
            expCtx.fillStyle = '#ffffff';
            expCtx.fillRect(0, 0, 400, 400);

            // Draw dashed outer border
            expCtx.strokeStyle = '#34d399';
            expCtx.lineWidth = 8;
            expCtx.strokeRect(10, 10, 380, 380);

            // Draw guide Kanji (light gray)
            expCtx.font = '900 200px "M PLUS Rounded 1c", sans-serif';
            expCtx.fillStyle = '#cbd5e1';
            expCtx.textAlign = 'center';
            expCtx.textBaseline = 'middle';
            expCtx.fillText(data.kanji, 200, 200);

            // Overlay user hand-written lines from active canvas
            expCtx.drawImage(canvas, 10, 10, 380, 380);

            // Trigger Image Download
            const link = document.createElement('a');
            link.download = `かんじ_れんしゅう_${data.kanji}.png`;
            link.href = exportCanvas.toDataURL('image/png');
            link.click();

            speakText('しゃしんに ほぞん したよ！');
        }

        function checkWriting() {
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let paintedPixels = 0;
            for (let i = 3; i < imgData.data.length; i += 4) {
                if (imgData.data[i] > 0) paintedPixels++;
            }

            if (paintedPixels > 1000) {
                playSound('clear');
                document.getElementById('hanamaru-overlay').classList.remove('hidden');
                speakText('たいへん よくできました！はなまるです！');
                addStar();
            } else {
                playSound('pop');
                speakText('かんじを なぞって かいてみてね！');
            }
        }

            document.body.addEventListener('click', initAudio, { once: true });
